<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="https://openlayers.org/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Using OpenLayers with Vite</title>
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css">
  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
  <!-- Start Fitur Pop Up -->
  <div id="popup" class="ol-popup">
    <a href="#" id="popup-closer" class="ol-popup-closer"></a>
    <div id="popup-content"></div>
  </div>

  <div id="map"></div>

  <!-- Container untuk checkbox -->
  <div class="overlay-container">
    <label>
      <input type="checkbox" id="polygon" checked>
      Polygon Prov Riau
    </label>
    <label>
      <input type="checkbox" id="point" checked>
      Titik Persebaran Banjir
    </label>
    <label>
      <br>
      <h5>Info:</h5>
      <div id="info">&nbsp;</div>
    </label>

    <label>
      <input type="checkbox" id="survei" checked>
      Titik Survei Walkability
    </label>
    <div class="sub-kategori">
      <label><input type="checkbox" class="kat" value="halte" checked> <img src="icon/halte.png"> Halte</label>
      <label><input type="checkbox" class="kat" value="zebra" checked> <img src="icon/zebra.png"> Zebra Cross</label>
      <label><input type="checkbox" class="kat" value="trotoar" checked> <img src="icon/trotoar.png"> Trotoar</label>
      <label><input type="checkbox" class="kat" value="lainnya" checked> <img src="icon/lainnya.png"> Lainnya</label>
    </div>
  </div>
  <!-- Modal foto survei -->
  <div class="modal fade" id="modalFoto" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content bg-transparent border-0">
        <div class="modal-header border-0 py-2">
          <h6 class="modal-title text-white" id="modalFotoJudul"></h6>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Tutup"></button>
        </div>
        <div class="modal-body text-center p-0 position-relative">
          <img id="modalFotoImg" class="rounded" alt="Foto survei">
          <button type="button" class="foto-nav kiri" id="fotoPrev">&#8249;</button>
          <button type="button" class="foto-nav kanan" id="fotoNext">&#8250;</button>
        </div>
        <div class="text-center text-white-50 small py-2" id="modalFotoHitung"></div>
      </div>
    </div>
  </div>
  <script type="module" src="./main.js"></script>
</body>

</html>
